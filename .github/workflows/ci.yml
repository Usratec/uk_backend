name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [develop, stage, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    # The tests need a database. GitHub starts this container alongside the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uk_backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/uk_backend

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Dev deployment waiter
        run: bash tests/deploy/test_wait_ecs_dev.sh

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest

