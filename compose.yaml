# Local development stack: `docker compose up`.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: uk_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Reports when Postgres is ready for connections, so web does not start too early.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  # Holds the counters behind API rate limits and login lockouts, and the queue of background jobs.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    # Development server, instead of the gunicorn command in the Dockerfile.
    command: python manage.py runserver 0.0.0.0:8000
    environment: &django_env
      DJANGO_SETTINGS_MODULE: config.settings.local
      # Inside compose the other services are reachable by their service names.
      DATABASE_URL: postgres://postgres:postgres@db:5432/uk_backend
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      # Read from .env by compose. Empty means uploads go to the local filesystem.
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}

      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      CLOUDFRONT_COOKIE_DOMAIN: ${CLOUDFRONT_COOKIE_DOMAIN:-}
      VIDEO_TRANSCODING_ENABLED: ${VIDEO_TRANSCODING_ENABLED:-True}

      CELERY_TASK_ALWAYS_EAGER: "False"
    ports:
      - "8000:8000"
    # Mount the source code so edits apply without rebuilding the image.
    volumes: &source_code
      - .:/app
    depends_on: &backing_services
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Runs background jobs: finishing a purchase after Stripe confirms payment, sending emails, and
  # transcoding uploaded video. Both queues, because transcode_video is routed to its own queue and
  # would otherwise sit untouched here. How the queues are split across containers when deployed is
  # a deployment decision, not this file's.
  worker:
    build: .
    command: celery --app config worker --queues celery,video --loglevel info
    environment: *django_env
    volumes: *source_code
    depends_on: *backing_services

  # An S3 bucket on this machine, so the upload and streaming pipeline can be exercised without
  # an AWS account. Started only on request:
  #
  #   docker compose --profile s3 up
  #
  # It needs the four S3_ variables in .env to match (see the README), and `127.0.0.1 localstack`
  # in /etc/hosts if a browser on this machine is to follow the presigned URLs the backend signs —
  # the host is part of the signature, so the backend and the browser have to spell it the same way.
  localstack:
    image: localstack/localstack:3.0
    profiles: [s3]
    environment:
      SERVICES: s3
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

  # Puts the scheduled jobs on the queue at their appointed times. Only ever run one of these.
  beat:
    build: .
    command: celery --app config beat --loglevel info
    environment: *django_env
    volumes: *source_code
    depends_on: *backing_services

volumes:
  postgres_data:
  localstack_data:
